name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      punctuation:
        description: 'Also validate the unreleased punctuation prototype (never publish it)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} x86-64
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            triplet: x64-linux
          - os: windows-2022
            platform: windows
            triplet: x64-windows-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: dependency-cache
        with:
          path: .vcpkg-cache
          key: deps-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: deps-${{ runner.os }}-
      - name: Windows PowerShell installer transport
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/installer_windows.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Bootstrap pinned vcpkg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git init "$RUNNER_TEMP/mika-vcpkg"
          git -C "$RUNNER_TEMP/mika-vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/mika-vcpkg" fetch --depth 1 origin a5f736224e85b32e25a8ffc52562333180396642
          git -C "$RUNNER_TEMP/mika-vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/mika-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Bootstrap pinned vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null
          git init "$env:RUNNER_TEMP/mika-vcpkg"
          git -C "$env:RUNNER_TEMP/mika-vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$env:RUNNER_TEMP/mika-vcpkg" fetch --depth 1 origin a5f736224e85b32e25a8ffc52562333180396642
          git -C "$env:RUNNER_TEMP/mika-vcpkg" checkout --detach FETCH_HEAD
          & "$env:RUNNER_TEMP/mika-vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Configure and build (Linux, glibc 2.35 baseline)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/mika-vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DCMAKE_INSTALL_LIBDIR=lib \
            -DMIKA_RELEASE_BUNDLE=ON -DMIKA_NATIVE_CPU=OFF \
            -DMIKA_TEST_MODEL="$PWD/build/test-model.gguf"
          cmake --build build --parallel 3
      - name: Configure and build (Windows, static CRT)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP/mika-vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DMIKA_RELEASE_BUNDLE=ON -DMIKA_NATIVE_CPU=OFF `
            "-DMIKA_TEST_MODEL=$env:GITHUB_WORKSPACE/build/test-model.gguf"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test real model and package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 scripts/fetch_test_model.py build/bin/mika-download-test "$PWD/build/test-model.gguf"
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix "$PWD/stage"
          cmake --install build --prefix "$PWD/stage" --component Validation
          version=$(sed -n 's/^project(mika VERSION \([^ ]*\).*/v\1/p' CMakeLists.txt)
          python3 scripts/package.py --stage stage --output dist --platform linux --version "$version" \
            --dependencies build/vcpkg_installed/x64-linux/share
          python3 scripts/check_package.py --stage stage --archive dist/mika-linux-x86_64.tar.gz \
            --model "$PWD/build/test-model.gguf" --sample "$PWD/build/_deps/transcribe-src/samples/jfk.wav"
      - name: Test real model and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/fetch_test_model.py build/bin/Release/mika-download-test.exe "$env:GITHUB_WORKSPACE/build/test-model.gguf"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE/stage"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE/stage" --component Validation
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $match = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(mika VERSION ([^ ]+)')
          $version = 'v' + $match.Groups[1].Value
          python scripts/package.py --stage stage --output dist --platform windows --version $version `
            --dependencies build/vcpkg_installed/x64-windows-static/share
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check_package.py --stage stage --archive dist/mika-windows-x86_64.zip `
            --model "$env:GITHUB_WORKSPACE/build/test-model.gguf" --sample "$env:GITHUB_WORKSPACE/build/_deps/transcribe-src/samples/jfk.wav" `
            --installer-fixture "$env:GITHUB_WORKSPACE/build/bin/Release/mika-install-fixture.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate opt-in punctuation prototype (Linux)
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.punctuation
        shell: bash
        run: |
          cmake -S . -B build-punctuation -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/mika-vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_INSTALLED_DIR="$PWD/build/vcpkg_installed" \
            -DMIKA_EXPERIMENTAL_PUNCTUATION=ON -DMIKA_NATIVE_CPU=ON \
            -DFETCHCONTENT_SOURCE_DIR_TRANSCRIBE="$PWD/build/_deps/transcribe-src" \
            -DFETCHCONTENT_SOURCE_DIR_MINIAUDIO="$PWD/build/_deps/miniaudio-src" \
            -DMIKA_TEST_MODEL="$PWD/build/test-model.gguf"
          cmake --build build-punctuation --parallel 3
          ctest --test-dir build-punctuation --output-on-failure
          python3 scripts/evaluate_punctuation.py --probe build-punctuation/bin/mika-punctuation-test \
            --assets build-punctuation/bin/punctuation --output build-punctuation/quality-report.json
          python3 scripts/benchmark_punctuation.py --probe build-punctuation/bin/mika-punctuation-test \
            --assets build-punctuation/bin/punctuation --output build-punctuation/resource-report.json
      - name: Validate opt-in punctuation prototype (Windows)
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.punctuation
        shell: pwsh
        run: |
          cmake -S . -B build-punctuation -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP/mika-vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/build/vcpkg_installed" `
            -DMIKA_EXPERIMENTAL_PUNCTUATION=ON -DMIKA_NATIVE_CPU=ON `
            "-DFETCHCONTENT_SOURCE_DIR_TRANSCRIBE=$env:GITHUB_WORKSPACE/build/_deps/transcribe-src" `
            "-DFETCHCONTENT_SOURCE_DIR_MINIAUDIO=$env:GITHUB_WORKSPACE/build/_deps/miniaudio-src" `
            "-DMIKA_TEST_MODEL=$env:GITHUB_WORKSPACE/build/test-model.gguf"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-punctuation --config Release --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build-punctuation -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/evaluate_punctuation.py --probe build-punctuation/bin/Release/mika-punctuation-test.exe `
            --assets build-punctuation/bin/Release/punctuation --output build-punctuation/quality-report.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/benchmark_punctuation.py --probe build-punctuation/bin/Release/mika-punctuation-test.exe `
            --assets build-punctuation/bin/Release/punctuation --output build-punctuation/resource-report.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.event_name == 'workflow_dispatch' && inputs.punctuation
        with:
          name: punctuation-checks-${{ matrix.platform }}
          path: |
            build-punctuation/*-report.json
            build-punctuation/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mika-${{ matrix.platform }}-x86_64
          path: dist/*
          if-no-files-found: error
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always() && steps.dependency-cache.outputs.cache-hit != 'true' && hashFiles('.vcpkg-cache/**/*.zip') != ''
        with:
          path: .vcpkg-cache
          key: deps-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mika-*
          merge-multiple: true
          path: dist
      - name: Publish checked assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/^project(mika VERSION \([^ ]*\).*/v\1/p' CMakeLists.txt)
          test "$version" = "$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest \
            --title "Mika $GITHUB_REF_NAME" --notes-file .github/release-notes.md
