name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }} x86-64
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            triplet: x64-linux
          - os: windows-2022
            platform: windows
            triplet: x64-windows-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, build tools only
        id: python
        with:
          python-version: '3.12'
      - name: Install pinned developer-only model conversion tools
        run: python -m pip install --requirement scripts/requirements-punctuation.txt
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: dependency-cache
        with:
          path: .vcpkg-cache
          key: deps-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: deps-${{ runner.os }}-
      - name: Windows PowerShell installer transport
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/installer_windows.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Bootstrap pinned vcpkg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git init "$RUNNER_TEMP/mika-vcpkg"
          git -C "$RUNNER_TEMP/mika-vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/mika-vcpkg" fetch --depth 1 origin a5f736224e85b32e25a8ffc52562333180396642
          git -C "$RUNNER_TEMP/mika-vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/mika-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Bootstrap pinned vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null
          git init "$env:RUNNER_TEMP/mika-vcpkg"
          git -C "$env:RUNNER_TEMP/mika-vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$env:RUNNER_TEMP/mika-vcpkg" fetch --depth 1 origin a5f736224e85b32e25a8ffc52562333180396642
          git -C "$env:RUNNER_TEMP/mika-vcpkg" checkout --detach FETCH_HEAD
          & "$env:RUNNER_TEMP/mika-vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build portable production package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/mika-vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DCMAKE_INSTALL_LIBDIR=lib \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
            -DMIKA_RELEASE_BUNDLE=ON -DMIKA_NATIVE_CPU=OFF \
            -DMIKA_TEST_MODEL="$PWD/build/test-model.gguf"
          cmake --build build --parallel 3
      - name: Build portable production package (Windows, static CRT)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP/mika-vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" `
            -DMIKA_RELEASE_BUNDLE=ON -DMIKA_NATIVE_CPU=OFF `
            "-DMIKA_TEST_MODEL=$env:GITHUB_WORKSPACE/build/test-model.gguf"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test and package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/fetch_test_model.py build/bin/mika-download-test "$PWD/build/test-model.gguf"
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix "$PWD/stage"
          cmake --install build --prefix "$PWD/stage" --component Validation
          version=$(sed -n 's/^project(mika VERSION \([^ ]*\).*/v\1/p' CMakeLists.txt)
          python scripts/package.py --stage stage --output dist --platform linux --version "$version" \
            --dependencies build/vcpkg_installed/x64-linux/share
          python scripts/check_package.py --stage stage --archive dist/mika-linux-x86_64.tar.gz \
            --model "$PWD/build/test-model.gguf" --sample "$PWD/build/_deps/transcribe-src/samples/jfk.wav"
      - name: Test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/fetch_test_model.py build/bin/Release/mika-download-test.exe "$env:GITHUB_WORKSPACE/build/test-model.gguf"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE/stage"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE/stage" --component Validation
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $match = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(mika VERSION ([^ ]+)')
          $version = 'v' + $match.Groups[1].Value
          python scripts/package.py --stage stage --output dist --platform windows --version $version `
            --dependencies build/vcpkg_installed/x64-windows-static/share
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check_package.py --stage stage --archive dist/mika-windows-x86_64.zip `
            --model "$env:GITHUB_WORKSPACE/build/test-model.gguf" `
            --sample "$env:GITHUB_WORKSPACE/build/_deps/transcribe-src/samples/jfk.wav" `
            --installer-fixture "$env:GITHUB_WORKSPACE/build/bin/Release/mika-install-fixture.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Record formatting and resource measurements
        shell: bash
        run: |
          bin=build/bin
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then bin=build/bin/Release; suffix=.exe; fi
          python scripts/evaluate_punctuation.py --probe "$bin/mika-punctuation-test$suffix" \
            --assets "$bin/punctuation" --output build/quality-report.json
          python scripts/evaluate_punctuation.py --probe "$bin/mika-punctuation-test$suffix" \
            --assets "$bin/punctuation" --corpus tests/punctuation_holdout.json --output build/holdout-report.json
          python scripts/benchmark_punctuation.py --probe "$bin/mika-punctuation-test$suffix" \
            --assets "$bin/punctuation" --output build/resource-report.json
          python scripts/benchmark_pipeline.py --probe "$bin/mika-inference-test$suffix" \
            --model "$PWD/build/test-model.gguf" --sample "$PWD/build/_deps/transcribe-src/samples/jfk.wav" \
            --output build/pipeline-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: checks-${{ matrix.platform }}
          path: |
            build/*-report.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mika-${{ matrix.platform }}-x86_64
          path: dist/*
          if-no-files-found: error
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always() && steps.dependency-cache.outputs.cache-hit != 'true' && hashFiles('.vcpkg-cache/**/*.zip') != ''
        with:
          path: .vcpkg-cache
          key: deps-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mika-*
          merge-multiple: true
          path: dist
      - name: Publish checked assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/^project(mika VERSION \([^ ]*\).*/v\1/p' CMakeLists.txt)
          test "$version" = "$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --latest \
            --title "Mika $GITHUB_REF_NAME" --notes-file .github/release-notes.md
