name: Build and test

on:
  push:
    branches: [main, feat/macos-cpu, feat/readiness]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the source version after all checks pass (main only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  macos-cpu:
    name: Experimental macOS ARM64 CPU
    runs-on: macos-14
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      VCPKG_DISABLE_METRICS: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: '3.12'
      - name: Native stock-Bash installer/removal fixture preflight
        timeout-minutes: 3
        run: |
          python tests/macos_scripts.py
          python tests/release_publish.py
      - name: Install pinned build-only conversion tools
        run: python -m pip install -r scripts/requirements-punctuation.txt
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dependency-cache
        with:
          path: .vcpkg-cache
          key: deps-macos-arm64-${{ hashFiles('vcpkg.json') }}
      - name: Bootstrap pinned native dependencies
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git init "$RUNNER_TEMP/mika-vcpkg"
          git -C "$RUNNER_TEMP/mika-vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/mika-vcpkg" fetch --depth 1 origin a5f736224e85b32e25a8ffc52562333180396642
          git -C "$RUNNER_TEMP/mika-vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/mika-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Build one static ARM64 CPU speech backend (no Metal/Core ML inference)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/mika-vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DMIKA_RELEASE_BUNDLE=ON -DMIKA_NATIVE_CPU=OFF \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
            -DMIKA_TEST_MODEL="$PWD/build/test-model.gguf"
          cmake --build build --parallel 3
      - name: Native unit, PTY, formatter, real-file and five-minute tests (no microphone)
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python scripts/fetch_test_model.py build/bin/mika-download-test "$PWD/build/test-model.gguf"
          ctest --test-dir build --output-on-failure
      - name: Stage and ad-hoc sign experimental binaries
        run: |
          cmake --install build --prefix "$PWD/stage"
          cmake --install build --prefix "$PWD/stage" --component Validation
          for binary in stage/bin/mika stage/bin/punctuation/*.dylib; do
            codesign --force --sign - "$binary"
          done
      - name: Package and validate installed/relocated CPU inference and removal
        run: |
          version=$(awk '/^project\(mika VERSION / { print "v" $3 }' CMakeLists.txt)
          python scripts/package.py --stage stage --output dist --platform macos --version "$version" \
            --dependencies build/vcpkg_installed/arm64-osx/share
          python scripts/check_macos_package.py --build build --stage stage \
            --archive dist/mika-macos-arm64.tar.gz --model "$PWD/build/test-model.gguf" \
            --sample "$PWD/build/_deps/transcribe-src/samples/jfk.wav"
          python scripts/evaluate_punctuation.py --probe build/bin/mika-punctuation-test \
            --assets build/bin/punctuation --output build/macos-quality-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: experimental-macos-checks
          path: |
            build/*-report.json
            build/Testing/Temporary/LastTest.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mika-macos-arm64
          path: dist/*
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.dependency-cache.outputs.cache-hit != 'true' && hashFiles('.vcpkg-cache/**/*.zip') != ''
        with:
          path: .vcpkg-cache
          key: deps-macos-arm64-${{ hashFiles('vcpkg.json') }}

  uninstallers:
    name: Uninstallers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux install/uninstall and piped-confirmation fixtures
        if: runner.os == 'Linux'
        run: python3 tests/uninstallers.py
      - name: Native Windows PowerShell 5.1 removal fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/uninstall_windows.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  model-free:
    name: Model-free regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native test prerequisites (no ML packages or weights)
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev libssl-dev
      - name: Build and test shared core and CLI fixtures
        run: |
          cmake -S tests/model-free -B build-model-free -DCMAKE_BUILD_TYPE=Release
          cmake --build build-model-free --parallel 2
          ctest --test-dir build-model-free --output-on-failure
      - name: Instrument owned core with AddressSanitizer and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S tests/model-free -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DMIKA_SANITIZERS=ON
          cmake --build build-sanitizers --parallel 2
          ctest --test-dir build-sanitizers --output-on-failure

  package:
    name: ${{ matrix.platform }} x86-64
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            triplet: x64-linux
          - os: windows-2022
            platform: windows
            triplet: x64-windows-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, build tools only
        id: python
        with:
          python-version: '3.12'
      - name: Install pinned developer-only model conversion tools
        run: python -m pip install --requirement scripts/requirements-punctuation.txt
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dependency-cache
        with:
          path: .vcpkg-cache
          key: deps-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: deps-${{ runner.os }}-
      - name: Windows PowerShell installer transport
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/installer_windows.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Bootstrap pinned vcpkg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git init "$RUNNER_TEMP/mika-vcpkg"
          git -C "$RUNNER_TEMP/mika-vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/mika-vcpkg" fetch --depth 1 origin a5f736224e85b32e25a8ffc52562333180396642
          git -C "$RUNNER_TEMP/mika-vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/mika-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Bootstrap pinned vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null
          git init "$env:RUNNER_TEMP/mika-vcpkg"
          git -C "$env:RUNNER_TEMP/mika-vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$env:RUNNER_TEMP/mika-vcpkg" fetch --depth 1 origin a5f736224e85b32e25a8ffc52562333180396642
          git -C "$env:RUNNER_TEMP/mika-vcpkg" checkout --detach FETCH_HEAD
          & "$env:RUNNER_TEMP/mika-vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build portable production package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/mika-vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DCMAKE_INSTALL_LIBDIR=lib \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
            -DMIKA_RELEASE_BUNDLE=ON -DMIKA_NATIVE_CPU=OFF \
            -DMIKA_TEST_MODEL="$PWD/build/test-model.gguf"
          cmake --build build --parallel 3
      - name: Build portable production package (Windows, static CRT)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP/mika-vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}" `
            -DMIKA_RELEASE_BUNDLE=ON -DMIKA_NATIVE_CPU=OFF `
            "-DMIKA_TEST_MODEL=$env:GITHUB_WORKSPACE/build/test-model.gguf"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test and package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/fetch_test_model.py build/bin/mika-download-test "$PWD/build/test-model.gguf"
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix "$PWD/stage"
          cmake --install build --prefix "$PWD/stage" --component Validation
          version=$(sed -n 's/^project(mika VERSION \([^ ]*\).*/v\1/p' CMakeLists.txt)
          python scripts/package.py --stage stage --output dist --platform linux --version "$version" \
            --dependencies build/vcpkg_installed/x64-linux/share
          python scripts/check_package.py --stage stage --archive dist/mika-linux-x86_64.tar.gz \
            --model "$PWD/build/test-model.gguf" --sample "$PWD/build/_deps/transcribe-src/samples/jfk.wav"
      - name: Test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/fetch_test_model.py build/bin/Release/mika-download-test.exe "$env:GITHUB_WORKSPACE/build/test-model.gguf"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE/stage"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE/stage" --component Validation
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $match = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(mika VERSION ([^ ]+)')
          $version = 'v' + $match.Groups[1].Value
          python scripts/package.py --stage stage --output dist --platform windows --version $version `
            --dependencies build/vcpkg_installed/x64-windows-static/share
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check_package.py --stage stage --archive dist/mika-windows-x86_64.zip `
            --model "$env:GITHUB_WORKSPACE/build/test-model.gguf" `
            --sample "$env:GITHUB_WORKSPACE/build/_deps/transcribe-src/samples/jfk.wav" `
            --installer-fixture "$env:GITHUB_WORKSPACE/build/bin/Release/mika-install-fixture.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Record formatting and resource measurements
        shell: bash
        run: |
          bin=build/bin
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then bin=build/bin/Release; suffix=.exe; fi
          python scripts/evaluate_punctuation.py --probe "$bin/mika-punctuation-test$suffix" \
            --assets "$bin/punctuation" --output build/quality-report.json
          python scripts/evaluate_punctuation.py --probe "$bin/mika-punctuation-test$suffix" \
            --assets "$bin/punctuation" --corpus tests/punctuation_holdout.json --output build/holdout-report.json
          python scripts/benchmark_punctuation.py --probe "$bin/mika-punctuation-test$suffix" \
            --assets "$bin/punctuation" --output build/resource-report.json
          python scripts/benchmark_pipeline.py --probe "$bin/mika-inference-test$suffix" \
            --model "$PWD/build/test-model.gguf" --sample "$PWD/build/_deps/transcribe-src/samples/jfk.wav" \
            --output build/pipeline-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-${{ matrix.platform }}
          path: |
            build/*-report.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mika-${{ matrix.platform }}-x86_64
          path: dist/*
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.dependency-cache.outputs.cache-hit != 'true' && hashFiles('.vcpkg-cache/**/*.zip') != ''
        with:
          path: .vcpkg-cache
          key: deps-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

  release-assets:
    name: Release asset preflight (no publication)
    needs: [package, macos-cpu]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mika-*
          merge-multiple: true
          path: dist
      - name: Check all three archives, checksums and embedded versions
        run: |
          version=$(sed -n 's/^project(mika VERSION \([^ ]*\).*/v\1/p' CMakeLists.txt)
          python3 scripts/check_release_assets.py --directory dist --version "$version"

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' && inputs.publish_release)
    needs: [uninstallers, model-free, package, macos-cpu, release-assets]
    runs-on: ubuntu-22.04
    concurrency:
      group: mika-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mika-*
          merge-multiple: true
          path: dist
      - name: Publish checked assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(sed -n 's/^project(mika VERSION \([^ ]*\).*/v\1/p' CMakeLists.txt)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { printf 'Invalid release version\n' >&2; exit 1; }
          python3 scripts/check_release_assets.py --directory dist --version "$version"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main
            # Create an immutable lightweight tag at this fully tested commit.
            # GITHUB_TOKEN tag creation does not start another workflow run.
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" --jq .object.sha 2>/dev/null || true)
            if [[ -n "$existing" ]]; then
              test "$existing" = "$GITHUB_SHA"
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$version" -f sha="$GITHUB_SHA" >/dev/null
            fi
          else
            test "$version" = "$GITHUB_REF_NAME"
          fi
          # Keep the release private until all six checked assets are uploaded.
          gh release create "$version" dist/* --verify-tag --draft \
            --title "Mika $version" --notes-file .github/release-notes.md
          test "$(gh release view "$version" --json assets --jq '[.assets[] | select(.state == "uploaded")] | length')" = 6
          gh release edit "$version" --draft=false --latest
