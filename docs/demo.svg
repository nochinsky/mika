<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 170" width="680" height="170" role="img" aria-label="mika records speech, transcribes it, and prints the text">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:15px;opacity:0;animation-duration:13.0s;animation-iteration-count:infinite;animation-timing-function:step-end;white-space:pre}
.cmd{fill:#e6e6e6} .p{fill:#7ee787} .status{fill:#8b949e} .out{fill:#ffffff;font-weight:600}
.note{fill:#6e7681;font-size:12px;font-style:italic}
@media (prefers-reduced-motion:reduce){text{animation:none} .fin{opacity:1}}
@keyframes f0{0%{opacity:0}2.308%{opacity:0}2.308%,3.846%{opacity:1}3.847%{opacity:0}100%{opacity:0}}
@keyframes f1{0%{opacity:0}3.846%{opacity:0}3.846%,5.385%{opacity:1}5.386%{opacity:0}100%{opacity:0}}
@keyframes f2{0%{opacity:0}5.385%{opacity:0}5.385%,6.923%{opacity:1}6.924%{opacity:0}100%{opacity:0}}
@keyframes f3{0%{opacity:0}6.923%{opacity:0}6.923%,100.000%{opacity:1}100%{opacity:1}}
@keyframes f4{0%{opacity:0}10.000%{opacity:0}10.000%,16.154%{opacity:1}16.155%{opacity:0}100%{opacity:0}}
@keyframes f5{0%{opacity:0}16.154%{opacity:0}16.154%,23.846%{opacity:1}23.847%{opacity:0}100%{opacity:0}}
@keyframes f6{0%{opacity:0}23.846%{opacity:0}23.846%,31.538%{opacity:1}31.539%{opacity:0}100%{opacity:0}}
@keyframes f7{0%{opacity:0}31.538%{opacity:0}31.538%,39.231%{opacity:1}39.232%{opacity:0}100%{opacity:0}}
@keyframes f8{0%{opacity:0}39.231%{opacity:0}39.231%,46.923%{opacity:1}46.924%{opacity:0}100%{opacity:0}}
@keyframes f9{0%{opacity:0}46.923%{opacity:0}46.923%,54.615%{opacity:1}54.616%{opacity:0}100%{opacity:0}}
@keyframes f10{0%{opacity:0}54.615%{opacity:0}54.615%,61.538%{opacity:1}61.539%{opacity:0}100%{opacity:0}}
@keyframes f11{0%{opacity:0}61.538%{opacity:0}61.538%,66.154%{opacity:1}66.155%{opacity:0}100%{opacity:0}}
@keyframes f12{0%{opacity:0}66.154%{opacity:0}66.154%,100.000%{opacity:1}100%{opacity:1}}
@keyframes f13{0%{opacity:0}66.154%{opacity:0}66.154%,100.000%{opacity:1}100%{opacity:1}}
@keyframes sp{0%{opacity:0}19.231%{opacity:0}19.231%,53.077%{opacity:1}53.078%{opacity:0}100%{opacity:0}}
</style>
<rect width="680" height="170" rx="10" fill="#0d1117"/>
<rect width="680" height="32" rx="10" fill="#161b22"/><rect y="22" width="680" height="10" fill="#161b22"/>
<circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
<text x="22" y="66" class="cmd" style="animation-name:f0"><tspan class="p">$</tspan> m</text>
<text x="22" y="66" class="cmd" style="animation-name:f1"><tspan class="p">$</tspan> mi</text>
<text x="22" y="66" class="cmd" style="animation-name:f2"><tspan class="p">$</tspan> mik</text>
<text x="22" y="66" class="cmd fin" style="animation-name:f3"><tspan class="p">$</tspan> mika</text>
<text x="22" y="92" class="status" style="animation-name:f4">Starting...</text>
<text x="22" y="92" class="status" style="animation-name:f5">Listening 00:00 / 05:00   Enter: finish | Esc: cancel</text>
<text x="22" y="92" class="status" style="animation-name:f6">Listening 00:01 / 05:00   Enter: finish | Esc: cancel</text>
<text x="22" y="92" class="status" style="animation-name:f7">Listening 00:02 / 05:00   Enter: finish | Esc: cancel</text>
<text x="22" y="92" class="status" style="animation-name:f8">Listening 00:03 / 05:00   Enter: finish | Esc: cancel</text>
<text x="22" y="92" class="status" style="animation-name:f9">Listening 00:04 / 05:00   Enter: finish | Esc: cancel</text>
<text x="22" y="92" class="status" style="animation-name:f10">Transcribing...</text>
<text x="22" y="92" class="status" style="animation-name:f11">Formatting...</text>
<text x="22" y="92" class="out fin" style="animation-name:f12">Please review the changes before merging.</text>
<text x="22" y="118" class="cmd fin" style="animation-name:f13"><tspan class="p">$</tspan> </text>
<text x="658" y="148" text-anchor="end" class="note" style="animation-name:sp">(speaking: “please review the changes before merging”, then Enter)</text>
</svg>
